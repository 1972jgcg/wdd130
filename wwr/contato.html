<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Entre em contato com a White Water Rafting para dúvidas, reservas, sugestões ou informações sobre nossas aventuras.">
    <meta name="author" content="Seu Nome">
    <title>Fale Conosco | White Water Rafting</title>

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>

    <header>
        <img src="imagens/designer.jpg" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>

        <section class="informacoes-contato">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <p>123 Rua Principal do Rio</p>
            <p>Foz do Iguaçu, Paraná</p>
            <p>+55 45 99999-9999</p>
            <p>info@corredeiras.com</p>
        </section>

        <section class="contato-grid">

            <div class="mapa">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4923.696489443678!2d-54.5586608!3d-25.493962200000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94f69a791f656da9%3A0x9320b92b1f8a43eb!2sPapelaria%20Papel%20%26%20Cia%20ONLOG!5e1!3m2!1ses!2sbr!4v1795663765398!5m2!1ses!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div class="formulario-contato">
                <form>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>

                    <label>Propósito da Mensagem</label>

                    <div class="radio-group">

                        <input type="radio" id="geral" name="assunto" value="geral">
                        <label for="geral">Consulta Geral</label>

                        <input type="radio" id="reserva" name="assunto" value="reserva">
                        <label for="reserva">Pergunta sobre Reserva</label>

                        <input type="radio" id="sugestao" name="assunto" value="sugestao">
                        <label for="sugestao">Sugestão de Site</label>

                    </div>

                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="5"></textarea>

                    <label class="checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Quero receber a newsletter mensal
                    </label>

                    <button type="submit">Entrar em Contato!</button>
                </form>
            </div>

        </section>

        <section class="funcionarios">
            <h2>Estamos Aqui para Servi-lo</h2>

            <div class="perfis">

                <figure>
                    <img src="imagens/maria.jpg" alt="Gerente Geral">
                    <figcaption>Maria Silva - Gerente Geral</figcaption>
                </figure>

                <figure>
                    <img src="imagens/joao.jpg" alt="Guia de Rafting">
                    <figcaption>João Santos - Guia de Rafting</figcaption>
                </figure>

                <figure>
                    <img src="imagens/ana.jpg" alt="Atendimento ao Cliente">
                    <figcaption>Ana Costa - Atendimento ao Cliente</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 White Water Rafting | Seu Nome</p>

        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/facebook.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="imagens/instagram.svg" alt="Instagram">
            </a>

            <a href="https://linkedin.com">
                <img src="imagens/linkedin.svg" alt="LinkedIn">
            </a>
        </nav>
    </footer>

</body>

</html>
